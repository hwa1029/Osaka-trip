<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>旅遊手冊</title>

  <!-- iOS 全螢幕 App 設定 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="旅遊手冊">

  <!-- Tailwind CSS & Google Fonts -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">

  <!-- Firebase 經典相容版 SDK (免除模組載入失敗問題) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    body {
      font-family: 'Noto Sans TC', sans-serif;
      background-color: #FAF8F3;
      color: #383431;
      -webkit-tap-highlight-color: transparent;
    }
    .ink-border { border: 2px solid #383431; }
    .tap-effect:active { transform: scale(0.97); }
  </style>
</head>
<body class="flex justify-center min-h-screen bg-[#F0ECE4] sm:py-6">

  <!-- 主容器 -->
  <div class="w-full max-w-md bg-[#FAF8F3] min-h-screen sm:min-h-[844px] sm:rounded-3xl sm:shadow-2xl flex flex-col relative ink-border sm:overflow-hidden pb-12">

    <!-- 頂部標題區 -->
    <header class="pt-5 pb-3 px-6 border-b border-[#EADFCF] bg-[#FAF8F3]/90 backdrop-blur sticky top-0 z-30">
      <div class="flex items-center justify-between mb-4">
        <div class="w-10 h-10 rounded-2xl bg-[#F8B4AD] ink-border flex items-center justify-center shadow-[1.5px_1.5px_0px_#383431]">
          <svg class="w-6 h-6 text-[#383431]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="5" width="18" height="14" rx="4" fill="#FDE6E3"/>
            <circle cx="8" cy="11" r="1.5" fill="#383431"/>
            <circle cx="16" cy="11" r="1.5" fill="#383431"/>
            <path d="M7 19l-2 2M17 19l2 2M9 5V3M15 5V3"/>
          </svg>
        </div>

        <h1 class="text-sm font-bold tracking-wide text-[#5C554F]" id="trip-header-title">釜山 5 天 4 夜 | 2026.11.11–11.15</h1>

        <!-- 同步狀態 -->
        <div class="flex items-center gap-1.5 bg-[#F2ECE1] px-2.5 py-1 rounded-full ink-border text-[11px] font-bold">
          <span class="w-2 h-2 rounded-full bg-amber-400" id="sync-dot"></span>
          <span id="sync-text">連線中...</span>
        </div>
      </div>

      <!-- 分頁標籤 -->
      <nav class="flex justify-end gap-2 text-sm font-bold">
        <button onclick="switchTab('flights')" id="tab-flights" class="px-4 py-1 rounded-full text-[#7C7267] transition-all">航班</button>
        <button onclick="switchTab('schedule')" id="tab-schedule" class="px-4 py-1 rounded-full bg-[#F8B4AD] text-[#383431] ink-border shadow-[1.5px_1.5px_0px_#383431] transition-all">行程</button>
        <button onclick="switchTab('checklist')" id="tab-checklist" class="px-4 py-1 rounded-full text-[#7C7267] transition-all">準備</button>
      </nav>
    </header>

    <!-- 主要內容區 -->
    <main class="flex-1 px-5 pt-4">

      <!-- 行程分頁 -->
      <section id="view-schedule" class="space-y-6">
        <div class="flex items-center gap-2">
          <div class="w-8 h-8 rounded-full bg-[#F8B4AD] ink-border flex items-center justify-center">
            <span class="text-xs">🚠</span>
          </div>
          <h2 class="text-xl font-bold tracking-tight">每日行程</h2>
        </div>

        <!-- 橫向日期滑軌 -->
        <div class="relative py-2">
          <div class="absolute top-[26px] left-4 right-4 h-[2px] bg-[#383431]"></div>
          <div class="flex justify-between relative z-10 text-center" id="date-buttons-container"></div>
        </div>

        <!-- 當天摘要卡片 -->
        <div class="bg-[#FDE6E3] p-4 rounded-2xl ink-border shadow-[2px_2px_0px_#383431]">
          <div class="flex items-start gap-3">
            <div class="w-12 h-10 rounded-xl bg-white/70 ink-border flex items-center justify-center shrink-0">
              <span class="text-lg">🚠</span>
            </div>
            <div>
              <span class="text-xs font-bold text-[#A85850] uppercase" id="day-badge">Day 2</span>
              <h3 class="font-bold text-base mt-0.5" id="day-title">白淺灘文化村 + 松島纜車</h3>
              <p class="text-xs text-[#73685E] mt-1" id="day-hotel">🏨 住 京城飯店（西面）</p>
            </div>
          </div>
        </div>

        <!-- 時間軸節點 -->
        <div class="relative pl-6 space-y-5" id="timeline-container">
          <div class="absolute left-[11px] top-2 bottom-2 w-[2px] border-l-2 border-dashed border-[#8E8275]"></div>
          <div class="text-center py-8 text-sm text-[#8E8275]">雲端資料載入中...</div>
        </div>
      </section>

      <!-- 航班分頁 -->
      <section id="view-flights" class="hidden space-y-4">
        <h2 class="text-xl font-bold mb-3">航班資訊 ✈️</h2>
        <div class="bg-white p-4 rounded-2xl ink-border shadow-[2px_2px_0px_#383431] space-y-3">
          <div class="flex justify-between items-center text-xs font-bold text-[#8E8275]">
            <span>去程 • 2026.11.11</span>
            <span class="text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded-full ink-border">準點</span>
          </div>
          <div class="flex justify-between items-center py-2 border-y border-dashed border-[#DDD5C7]">
            <div class="text-center">
              <p class="text-2xl font-black">TPE</p>
              <p class="text-xs text-stone-500">桃園 07:45</p>
            </div>
            <div class="text-center text-xs text-stone-400">
              <span>2h 15m</span>
              <div class="w-20 h-[1.5px] bg-stone-300 my-1 relative">
                <span class="absolute -top-1.5 right-8 text-[10px]">✈️</span>
              </div>
            </div>
            <div class="text-center">
              <p class="text-2xl font-black">PUS</p>
              <p class="text-xs text-stone-500">金海 11:00</p>
            </div>
          </div>
          <p class="text-xs text-stone-500">星宇航空 JX800 • 第一航廈</p>
        </div>
      </section>

      <!-- 準備分頁 -->
      <section id="view-checklist" class="hidden space-y-4">
        <h2 class="text-xl font-bold mb-3">行前準備與清單 🧳</h2>
        <div class="bg-white p-4 rounded-2xl ink-border shadow-[2px_2px_0px_#383431] space-y-3">
          <label class="flex items-center gap-3 text-sm font-bold cursor-pointer">
            <input type="checkbox" checked class="w-5 h-5 accent-[#F8B4AD] rounded ink-border">
            <span>護照有效期限 6 個月以上</span>
          </label>
          <label class="flex items-center gap-3 text-sm font-bold cursor-pointer">
            <input type="checkbox" checked class="w-5 h-5 accent-[#F8B4AD] rounded ink-border">
            <span>填寫 Q-CODE 或 入境健康申報</span>
          </label>
          <label class="flex items-center gap-3 text-sm font-bold cursor-pointer">
            <input type="checkbox" class="w-5 h-5 accent-[#F8B4AD] rounded ink-border">
            <span>開通韓國 eSIM 網路流量</span>
          </label>
          <label class="flex items-center gap-3 text-sm font-bold cursor-pointer">
            <input type="checkbox" class="w-5 h-5 accent-[#F8B4AD] rounded ink-border">
            <span>準備 WOWPASS / T-money 交通卡</span>
          </label>
        </div>
      </section>

    </main>

    <!-- 新增按鈕 (FAB) -->
    <button onclick="openModal()" class="fixed sm:absolute bottom-6 right-6 w-14 h-14 bg-[#F8B4AD] ink-border rounded-full flex items-center justify-center shadow-[3px_3px_0px_#383431] tap-effect z-40">
      <svg class="w-7 h-7 text-[#383431]" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"></path>
      </svg>
    </button>

    <!-- 新增行程彈跳視窗 -->
    <div id="modal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
      <div class="bg-[#FAF8F3] w-full max-w-sm rounded-t-3xl sm:rounded-3xl p-6 ink-border shadow-2xl space-y-4">
        <div class="flex justify-between items-center border-b border-[#EADFCF] pb-3">
          <h3 class="font-bold text-lg">新增景點 / 交通 ✍️</h3>
          <button onclick="closeModal()" class="text-stone-400 hover:text-stone-700 text-xl font-bold">✕</button>
        </div>

        <form id="add-item-form" class="space-y-3">
          <div>
            <label class="text-xs font-bold text-stone-500">類別</label>
            <select id="item-type" class="w-full mt-1 p-2 rounded-xl bg-white ink-border text-sm font-bold">
              <option value="spot">景點 / 餐廳 (卡片)</option>
              <option value="transit">交通接駁 (膠囊標籤)</option>
            </select>
          </div>

          <div class="flex gap-2">
            <div class="w-1/3">
              <label class="text-xs font-bold text-stone-500">時間</label>
              <input type="text" id="item-time" placeholder="10:00" required class="w-full mt-1 p-2 rounded-xl bg-white ink-border text-sm font-bold">
            </div>
            <div class="w-2/3">
              <label class="text-xs font-bold text-stone-500">標題 / 景點名稱</label>
              <input type="text" id="item-title" placeholder="ARTE MUSEUM" required class="w-full mt-1 p-2 rounded-xl bg-white ink-border text-sm font-bold">
            </div>
          </div>

          <div>
            <label class="text-xs font-bold text-stone-500">備註說明</label>
            <input type="text" id="item-desc" placeholder="預計停留 1.5–2 小時" class="w-full mt-1 p-2 rounded-xl bg-white ink-border text-sm">
          </div>

          <div class="pt-2 flex gap-2">
            <button type="button" onclick="closeModal()" class="flex-1 py-2.5 rounded-xl bg-stone-200 text-stone-700 font-bold text-sm">取消</button>
            <button type="submit" class="flex-1 py-2.5 rounded-xl bg-[#F8B4AD] ink-border font-bold text-sm shadow-[2px_2px_0px_#383431] tap-effect">同步儲存</button>
          </div>
        </form>
      </div>
    </div>

  </div>

  <script>
    // 預設資料 (若尚未連上雲端，直接本地優先呈現，避免卡在載入中)
    const initialTripData = {
      title: "釜山 5 天 4 夜 | 2026.11.11–11.15",
      days: [
        {
          date: "11/11",
          weekDay: "週三",
          title: "抵達釜山 + 南浦洞商圈散策",
          hotel: "住 京城飯店（西面）",
          timeline: [
            { id: "1-1", type: "transit", time: "11:30", title: "金海輕軌 → 地鐵西面站", desc: "約 45 分鐘" },
            { id: "1-2", type: "spot", time: "13:00", title: "飯店寄放行李", desc: "京城飯店 Check-in" },
            { id: "1-3", type: "spot", time: "14:30", title: "南浦洞 BIFF 廣場 + 黑糖餅", desc: "吃道地堅果糖餅" }
          ]
        },
        {
          date: "11/12",
          weekDay: "週四",
          title: "白淺灘文化村 + 松島纜車",
          hotel: "住 京城飯店（西面）",
          timeline: [
            { id: "2-1", type: "transit", time: "09:00", title: "17 號公車：西面站 → 미창석유", desc: "約 1 小時 9 分" },
            { id: "2-2", type: "spot", time: "10:00", title: "ARTE MUSEUM Busan", desc: "預計 1.5–2 小時" },
            { id: "2-3", type: "transit", time: "11:00", title: "計程車到白淺灘文化村", desc: "約 20 分鐘" },
            { id: "2-4", type: "spot", time: "11:30", title: "白淺灘海景咖啡街", desc: "散步、看海、吃午餐" }
          ]
        },
        {
          date: "11/13",
          weekDay: "週五",
          title: "海雲台膠囊列車 + 青沙浦",
          hotel: "住 普爾曼大使酒店",
          timeline: [
            { id: "3-1", type: "spot", time: "10:00", title: "尾浦站搭乘海濱小火車", desc: "預約 10:30 班次" },
            { id: "3-2", type: "spot", time: "12:00", title: "青沙浦烤貝村午餐", desc: "經典海景烤扇貝" }
          ]
        },
        {
          date: "11/14",
          weekDay: "週六",
          title: "廣安里海水浴場 + 無人機燈光秀",
          hotel: "住 普爾曼大使酒店",
          timeline: [
            { id: "4-1", type: "spot", time: "14:00", title: "廣安里海景咖啡廳", desc: "放空看廣安大橋" },
            { id: "4-2", type: "spot", time: "19:00", title: "廣安里 M 懸吊無人機秀", desc: "週六限定無人機表演" }
          ]
        },
        {
          date: "11/15",
          weekDay: "週日",
          title: "樂天免稅店採買 + 返台",
          hotel: "溫暖的家",
          timeline: [
            { id: "5-1", type: "spot", time: "11:00", title: "西面地下街最後採買", desc: "伴手禮補貨" },
            { id: "5-2", type: "transit", time: "14:00", title: "前往金海機場", desc: "提早 2.5 小時辦理退稅" }
          ]
        }
      ]
    };

    let currentDayIndex = 1;
    let localTripData = initialTripData;

    // 先行渲染預設畫面，避免空白等待
    renderAll();

    // Firebase 配置
    const firebaseConfig = {
      apiKey: "AIzaSyDz7TKVb8wfBnuPEmGCX3fnOB0PWc1Ojtk",
      authDomain: "osaka-trip-635ce.firebaseapp.com",
      databaseURL: "https://osaka-trip-635ce-default-rtdb.firebaseio.com",
      projectId: "osaka-trip-635ce",
      storageBucket: "osaka-trip-635ce.firebasestorage.app",
      messagingSenderId: "31119870059",
      appId: "1:31119870059:web:67da49d8ecd0cca494892e"
    };

    let tripRef = null;

    try {
      firebase.initializeApp(firebaseConfig);
      const db = firebase.database();
      tripRef = db.ref("tripData");

      // 監聽雲端資料
      tripRef.on("value", (snapshot) => {
        const data = snapshot.val();
        if (!data) {
          tripRef.set(initialTripData);
        } else {
          localTripData = data;
          renderAll();
        }
        document.getElementById('sync-dot').className = "w-2 h-2 rounded-full bg-emerald-500 animate-pulse";
        document.getElementById('sync-text').innerText = "已連線";
      }, (err) => {
        console.warn("Firebase 連線提示:", err.message);
        document.getElementById('sync-dot').className = "w-2 h-2 rounded-full bg-amber-500";
        document.getElementById('sync-text').innerText = "單機模式";
      });
    } catch (e) {
      console.error(e);
    }

    function renderAll() {
      if (!localTripData) return;
      document.getElementById('trip-header-title').innerText = localTripData.title;
      renderDateButtons();
      renderTimeline();
    }

    function renderDateButtons() {
      const container = document.getElementById('date-buttons-container');
      container.innerHTML = '';
      localTripData.days.forEach((day, index) => {
        const isSelected = index === currentDayIndex;
        const btn = document.createElement('div');
        btn.className = "flex flex-col items-center cursor-pointer select-none group";
        btn.onclick = () => {
          currentDayIndex = index;
          renderAll();
        };
        btn.innerHTML = `
          <div class="h-8 flex items-center justify-center">
            ${isSelected ? `
              <div class="w-8 h-8 rounded-xl bg-[#F8B4AD] ink-border flex items-center justify-center -translate-y-1 shadow-[1.5px_1.5px_0px_#383431]">
                <svg class="w-4 h-4 text-[#383431]" viewBox="0 0 24 24" fill="currentColor">
                  <rect x="3" y="5" width="18" height="14" rx="4" fill="#FDE6E3" stroke="#383431" stroke-width="2"/>
                  <circle cx="8" cy="12" r="1.5" fill="#383431"/>
                  <circle cx="16" cy="12" r="1.5" fill="#383431"/>
                </svg>
              </div>
            ` : `
              <div class="w-3.5 h-3.5 rounded-full bg-white ink-border"></div>
            `}
          </div>
          <div class="mt-2 text-center">
            <span class="text-xs font-bold block ${isSelected ? 'bg-[#F8B4AD] px-2 py-0.5 rounded-full ink-border' : 'text-stone-700'}">${day.date}</span>
            <span class="text-[10px] text-stone-500 font-medium block mt-0.5">${day.weekDay}</span>
          </div>
        `;
        container.appendChild(btn);
      });
    }

    function renderTimeline() {
      const currentDay = localTripData.days[currentDayIndex];
      document.getElementById('day-badge').innerText = `Day ${currentDayIndex + 1}`;
      document.getElementById('day-title').innerText = currentDay.title;
      document.getElementById('day-hotel').innerText = currentDay.hotel;

      const container = document.getElementById('timeline-container');
      container.innerHTML = '<div class="absolute left-[11px] top-2 bottom-2 w-[2px] border-l-2 border-dashed border-[#8E8275]"></div>';

      if (!currentDay.timeline || currentDay.timeline.length === 0) {
        container.innerHTML += '<div class="text-xs text-stone-400 py-6">今天還沒有安排行程，點右下角 + 新增吧！</div>';
        return;
      }

      currentDay.timeline.forEach((item) => {
        const itemEl = document.createElement('div');
        itemEl.className = "relative flex items-start gap-3";
        if (item.type === 'transit') {
          itemEl.innerHTML = `
            <div class="w-6 h-6 rounded-full bg-[#FAF8F3] ink-border flex items-center justify-center -ml-[1px] mt-0.5 z-10 shrink-0">
              <div class="w-2 h-2 rounded-full bg-stone-700"></div>
            </div>
            <div class="flex-1 -mt-0.5">
              <span class="text-xs font-mono font-bold text-stone-500 mr-2">${item.time}</span>
              <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-[#E5F0F5] ink-border text-xs font-bold shadow-[1px_1px_0px_#383431]">
                <span>🚌</span>
                <span>${item.title}</span>
              </span>
              ${item.desc ? `<p class="text-[11px] text-stone-400 font-medium mt-1 pl-12">${item.desc}</p>` : ''}
            </div>
          `;
        } else {
          itemEl.innerHTML = `
            <div class="w-6 h-6 rounded-full bg-white ink-border flex items-center justify-center -ml-[1px] mt-1 z-10 shrink-0">
              <div class="w-2 h-2 rounded-full bg-stone-700"></div>
            </div>
            <div class="flex-1">
              <span class="text-xs font-mono font-bold text-stone-500 block mb-1">${item.time}</span>
              <div class="bg-white p-3.5 rounded-2xl ink-border shadow-[2px_2px_0px_#383431]">
                <h4 class="font-bold text-sm text-[#383431]">${item.title}</h4>
                ${item.desc ? `<p class="text-xs text-stone-400 mt-1">${item.desc}</p>` : ''}
              </div>
            </div>
          `;
        }
        container.appendChild(itemEl);
      });
    }

    document.getElementById('add-item-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const type = document.getElementById('item-type').value;
      const time = document.getElementById('item-time').value.trim();
      const title = document.getElementById('item-title').value.trim();
      const desc = document.getElementById('item-desc').value.trim();

      if (!localTripData.days[currentDayIndex].timeline) {
        localTripData.days[currentDayIndex].timeline = [];
      }

      localTripData.days[currentDayIndex].timeline.push({ id: Date.now().toString(), type, time, title, desc });
      localTripData.days[currentDayIndex].timeline.sort((a, b) => a.time.localeCompare(b.time));

      renderAll();
      closeModal();
      document.getElementById('add-item-form').reset();

      if (tripRef) {
        tripRef.set(localTripData);
      }
    });

    window.switchTab = function(tabName) {
      ['schedule', 'flights', 'checklist'].forEach(t => {
        document.getElementById(`view-${t}`).classList.add('hidden');
        document.getElementById(`tab-${t}`).className = "px-4 py-1 rounded-full text-[#7C7267] transition-all";
      });
      document.getElementById(`view-${tabName}`).classList.remove('hidden');
      document.getElementById(`tab-${tabName}`).className = "px-4 py-1 rounded-full bg-[#F8B4AD] text-[#383431] ink-border shadow-[1.5px_1.5px_0px_#383431] transition-all";
    };

    window.openModal = () => document.getElementById('modal').classList.remove('hidden');
    window.closeModal = () => document.getElementById('modal').classList.add('hidden');
  </script>
</body>
</html>

          </div>

          <div>
            <label class="text-xs font-bold text-stone-500">備註說明 (停留時間 / 交通詳情)</label>
            <input type="text" id="item-desc" placeholder="預計停留 1.5–2 小時" class="w-full mt-1 p-2 rounded-xl bg-white ink-border text-sm">
          </div>
